# WAS Port
server.port = 8080

# DB Information (Rocky Linux MariaDB)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://192.168.142.129:3306/jobbridge?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci

# DB's ID
spring.datasource.username=ykk

# DB's Password
spring.datasource.password=1234

# DB Connection Timeout (5 sec)
spring.datasource.hikari.connection-timeout=5000

# DTO Location
mybatis.type-aliases-package=org.ykk.jobbridge.dto

# SQL Query Location
mybatis.mapper-locations=classpath:mapper/*.xml

# DTO Mapping camel case (DB 컬럼 login_id -> DTO 변수 loginId)
mybatis.configuration.map-underscore-to-camel-case=true

spring.sql.init.mode=never

# DevTools : Maven/Vite 빌드 중 재시작 방지
spring.devtools.restart.enabled=false

# React 빌드 결과물(정적 파일) 위치
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0

# Kakao OpenAPI (길찾기) : 키는 환경변수 KAKAO_REST_API_KEY 에 설정 (소스에 키를 올리지 않기 위함)
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.enabled=true

# OpenAI OpenAPI (직무 적합도 평가) : 키는 환경변수 OPENAI_API_KEY 에 설정, 키가 없으면 키워드 규칙으로 계산함
openai.api-key=${OPENAI_API_KEY:}
openai.enabled=true
openai.model=gemini-3.5-flash-lite
openai.chat-completions-url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
