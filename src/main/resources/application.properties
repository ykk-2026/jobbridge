# Normal application runs always use MariaDB. H2 configuration exists only in src/test/resources.
spring.profiles.default=mariadb

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.ykk.jobbridge
mybatis.configuration.map-underscore-to-camel-case=true

# Prevent DevTools from restarting while Maven/Vite rebuilds replace target/classes.
spring.devtools.restart.enabled=false

spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
