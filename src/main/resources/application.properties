# Default local run uses the H2 file database below.
# To use MariaDB, run with: --spring.profiles.active=mariadb
spring.datasource.url=jdbc:h2:file:./data/jobbridge;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.ykk.jobbridge
mybatis.configuration.map-underscore-to-camel-case=true

